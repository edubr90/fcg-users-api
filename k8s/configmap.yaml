apiVersion: v1
kind: ConfigMap
metadata:
  name: users-api-config
  namespace: fcg
data:
  ASPNETCORE_ENVIRONMENT: "Production"
  ASPNETCORE_URLS: "http://+:8080"
  RabbitMQ__HostName: "rabbitmq"
  RabbitMQ__VHost: "/"
  JwtSettings__Issuer: "FCG"
  JwtSettings__Audience: "FCG"
  JwtSettings__ExpireInMinutes: 60